services:
  eureka:
    build:
      context: ../../lab3/lab3-support/eureka-server
    container_name: lab6-eureka
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8761/actuator/health || wget -qO- http://127.0.0.1:8761/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: lab6-redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: lab6-rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    expose:
      - "5672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  locker-service:
    build:
      context: ../../lab5/lab5-support
      dockerfile: ../../lab6/lab6-support/docker/Dockerfile.python
    container_name: lab6-locker-service
    command: ["python", "-m", "uvicorn", "demo.locker_service.app.main:app", "--host", "0.0.0.0", "--port", "8101"]
    expose:
      - "8101"
    environment:
      SERVICE_NAME: LOCKER-SERVICE
      SERVICE_PORT: "8101"
      INSTANCE_HOST: locker-service
      INSTANCE_IP: locker-service
      EUREKA_SERVER_URL: http://eureka:8761
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      DATABASE_URL: sqlite:////data/locker.db
      REDIS_URL: redis://redis:6379/0
      CACHE_PREFIX: lab6:demo:locker-service
    volumes:
      - locker_data:/data
    depends_on:
      eureka:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  parcel-service:
    build:
      context: ../../lab5/lab5-support
      dockerfile: ../../lab6/lab6-support/docker/Dockerfile.python
    container_name: lab6-parcel-service
    command: ["python", "-m", "uvicorn", "demo.parcel_service.app.main:app", "--host", "0.0.0.0", "--port", "8102"]
    expose:
      - "8102"
    environment:
      SERVICE_NAME: PARCEL-SERVICE
      SERVICE_PORT: "8102"
      INSTANCE_HOST: parcel-service
      INSTANCE_IP: parcel-service
      EUREKA_SERVER_URL: http://eureka:8761
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
    depends_on:
      eureka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      locker-service:
        condition: service_started

  api-gateway:
    build:
      context: ../../lab4/lab4-support/gateway
      dockerfile: ../../lab6/lab6-support/docker/Dockerfile.gateway
    container_name: lab6-api-gateway
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      GATEWAY_PORT: "8080"
      GATEWAY_EUREKA_URL: http://eureka:8761/eureka/
    depends_on:
      eureka:
        condition: service_healthy
      locker-service:
        condition: service_started
      parcel-service:
        condition: service_started

volumes:
  locker_data:
